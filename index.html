<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Tailwind CSS -->

    <!-- FontAwesome Icons -->

        <!-- Google Fonts & Diplomatic Typography -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {

    <style>
        html, body {
            overflow-x: hidden;
        }
        
        @media print {
            body {
                background: white !important;

            .no-print {
                display: none !important;

            .pdf-export-wrapper {
                transform: none !important;

            .pdf-container {
                box-shadow: none !important;
                margin: 0 !important;

        .uganda-flag-stripe {
            background: linear-gradient(90deg, #000000 0%, #000000 33.3%, #FCDC04 33.3%, #FCDC04 66.6%, #D92323 66.6%, #D92323 100%);

            width: 5px;
            height: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }

            background: #334155;

        }

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SPEECH_OPTIONS = {
            full: {
                id: 'full',
                label: '90s Diplomatic Speech',
                timeEst: '90s',
                targetWpm: '135 WPM',
                text: `Honorable Chairs, distinguished fellow delegates:

As we assemble in this chamber to debate the future of our youth, over seven million young Ugandans-and tens of millions more across developing nations-are fighting an invisible war without a single shield. We speak of economic transformation, digital innovation, and sustainable development, yet we routinely ignore the very foundation upon which that future rests: the mental resilience of our young people.

Uganda stands before the Global Youth Forum not to plead for sympathy, but to demand a fundamental shift in diplomatic priority. Systemic stigma, acute shortages of clinical professionals, and economic pressures have pushed youth mental healthcare into the shadows. We cannot afford to wait decades for traditional healthcare infrastructure to catch up while an entire generation breaks under the weight of inaction.

Uganda urges this committee to adopt a decisive, two-tier operational model:
  Tier 1 (Grassroots Peer-Counseling): Standardizing localized, youth-led peer networks trained in basic psychological first aid to provide immediate, non-stigmatized community care.
  Tier 2 (Offline-Resilient Digital Networks): Deploying low-bandwidth, zero-rated, and SMS-capable platforms to deliver mental health tools straight to underserved, low-connectivity regions.

Delegates, rhetoric will not heal a generation-structured, scalable mechanisms will. Uganda calls upon every country in this room to move past passive sympathy, sponsor our working paper, and build a resolution that turns youth mental resilience into immediate policy.

Thank you, Honorable Chairs. I yield my remaining time to the Chair.`
            },
            compressed: {
                id: 'compressed',
                label: '60s Timed Speech',
                timeEst: '55-60s',
                targetWpm: '125 WPM',
                text: `Honorable Chairs, distinguished delegates:

As we debate the future of our youth, over seven million young Ugandans-and millions more across developing nations-are fighting an invisible mental health crisis without a single shield. Systemic stigma and critical clinical shortages leave an entire generation vulnerable. 

Uganda demands a shift from passive sympathy to structural action. We propose a two-tier model: mobilizing youth-led peer counseling networks trained in basic psychological first aid, alongside zero-rated, offline-first digital support platforms for low-connectivity regions. 

Rhetoric will not heal a generation-actionable policy will. Uganda calls upon all delegates to join our bloc, sponsor our working paper, and prioritize youth mental resilience. 

Thank you, I yield my time to the Chair.`
            },
            crisp: {
                id: 'crisp',
                label: '45s Power Pitch',
                timeEst: '40-45s',
                targetWpm: '130 WPM',
                text: `Honorable Chairs, esteemed delegates:

Over seven million young Ugandans face an invisible mental health emergency without adequate clinical support. Passive sympathy is no longer an acceptable diplomatic response.

Uganda presents a two-tier structural solution: localized youth peer-counseling networks coupled with zero-rated, offline-first mobile mental health access. We urge all delegates to join our coalition, sponsor our working paper, and enact measurable health safeguards today.

Thank you, I yield to the Chair.`
            }
        };

        const INITIAL_MOTIONS = [
            {
                id: 1,
                title: "Assessing Infrastructure Gaps & Stigma in Youth Mental Health Systems",
                type: "Moderated Caucus",
                totalTime: "10 Mins",
                speakerTime: "45 Secs",
                purpose: "Establish baseline consensus on structural barriers in developing nations and low-resource settings."
            },
            {
                id: 2,
                title: "Implementing Two-Tier Frameworks: Peer Support & Digital Interventions",
                type: "Moderated Caucus",
                totalTime: "12 Mins",
                speakerTime: "60 Secs",
                purpose: "Detail actionable mechanisms combining offline youth peer networks with zero-rated mobile platforms."
            },
            {
                id: 3,
                title: "Bloc Building & Operative Drafting for Youth Support Networks",
                type: "Unmoderated Caucus",
                totalTime: "15 Mins",
                speakerTime: "N/A",
                purpose: "Gather co-sponsors, align regional perspectives, and draft working paper clauses for submission."
            }
        ];

        const INITIAL_RESOLUTIONS = [
            {
                id: 1,
                prefix: "Encourages",
                text: "member states to establish standardized, community-led peer counseling frameworks by training youth leaders in basic psychological first aid and non-clinical crisis management."
            },
            {
                id: 2,
                prefix: "Calls for",
                text: "the deployment of zero-rated, offline-first digital mental health tools and SMS-based support pipelines to ensure equitable access in low-connectivity rural regions."
            },
            {
                id: 3,
                prefix: "Urges",
                text: "the integration of culturally sensitive mental health literacy and psychosocial awareness modules into secondary and tertiary educational curricula."
            },
            {
                id: 4,
                prefix: "Recommends",
                text: "public-private partnerships between national health authorities, telecom providers, and youth NGOs to secure sustainable funding and infrastructure for decentralized care."
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('editor');
            const [isDesktop, setIsDesktop] = useState(window.innerWidth >= 1024);

            const [selectedSpeechKey, setSelectedSpeechKey] = useState('full');
            const [speechText, setSpeechText] = useState(SPEECH_OPTIONS.full.text);
            const [delegateName, setDelegateName] = useState('EGABO AARON');
            const [committeeName, setCommitteeName] = useState('Global Youth Forum (EchoMUN)');
            const [countryName, setCountryName] = useState('Republic of Uganda');
            const [topicName, setTopicName] = useState('Youth Mental Health Infrastructure & Digital Resilience');
            const [motions, setMotions] = useState(INITIAL_MOTIONS);
            const [resolutions, setResolutions] = useState(INITIAL_RESOLUTIONS);

            const [toastMessage, setToastMessage] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [previewZoom, setPreviewZoom] = useState(1);
            const [autoFitWidth, setAutoFitWidth] = useState(true);

            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(90);
            const [targetDuration, setTargetDuration] = useState(90);
            const [prompterFontSize, setPrompterFontSize] = useState(24);

            const pdfExportRef = useRef(null);
            const previewContainerRef = useRef(null);

            useEffect(() => {
                const handleResize = () => {
                    const desktop = window.innerWidth >= 1024;
                    setIsDesktop(desktop);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

                        useEffect(() => {
                const recalc = () => {
                    if (autoFitWidth && previewContainerRef.current) {
                        const containerWidth = previewContainerRef.current.clientWidth;
                        const a4DocWidth = 794;
                        const availableWidth = containerWidth - (isDesktop ? 36 : 16);
                        if (availableWidth < a4DocWidth) {
                            const calculatedScale = Math.max(0.35, availableWidth / a4DocWidth);
                            setPreviewZoom(Number(calculatedScale.toFixed(3)));
                        } else {
                            setPreviewZoom(1);
                        }
                    }
                };
                const timer = setTimeout(recalc, 60);
                return () => clearTimeout(timer);
            }, [activeTab, autoFitWidth, isDesktop]);

            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds((prev) => prev - 1);
                    }, 1000);
                } else if (timerSeconds === 0 && isTimerRunning) {
                    setIsTimerRunning(false);
                    showToast("Time expired! Yield time to the Chair.");
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timerSeconds]);

            const handleSpeechTypeChange = (key) => {
                setSelectedSpeechKey(key);
                setSpeechText(SPEECH_OPTIONS[key].text);
                const estSecs = key === 'full' ? 90 : (key === 'compressed' ? 60 : 45);
                setTargetDuration(estSecs);
                setTimerSeconds(estSecs);
                showToast(`Loaded ${SPEECH_OPTIONS[key].label}`);
            };

            const wordCount = speechText.trim().split(/\s+/).filter(Boolean).length;
            const estimatedSeconds = Math.round((wordCount / 135) * 60);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3200);
            };

            const copyToClipboard = (text, label) => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text);
                    showToast(`📋 ${label} copied to clipboard!`);
                } else {
                    const el = document.createElement('textarea');
                    el.value = text;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showToast(`📋 ${label} copied to clipboard!`);
                }
            };

            const resetTimer = () => {
                setIsTimerRunning(false);
                setTimerSeconds(targetDuration);
            };

                        const downloadPDF = async () => {
                if (isGenerating) return;
                setIsGenerating(true);
                showToast("Rendering official high-resolution diplomatic brief...");

                try {
                    if (document.fonts) {
                        await document.fonts.ready;
                    }

                    const target = document.getElementById("official-a4-brief") || pdfExportRef.current;
                    if (!target) {
                        throw new Error("Brief element not found");
                    }

                    const delegateSlug = (delegateName || "Delegate").replace(/\s+/g, "_");
                    const filename = `Uganda_EchoMUN2026_Diplomatic_Brief_${delegateSlug}.pdf`;

                    // Capture at 2.4x scale for crisp, razor-sharp vector-grade print quality
                    const canvas = await html2canvas(target, {
                        scale: 2.4,
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                        backgroundColor: "#ffffff",
                        width: 794,
                        height: 1123,
                        windowWidth: 794,
                        windowHeight: 1123,
                        scrollX: 0,
                        scrollY: 0,
                        onclone: (clonedDoc) => {
                            const clonedBrief = clonedDoc.getElementById("official-a4-brief") || clonedDoc.querySelector('[data-pdf-element="true"]');
                            if (clonedBrief) {
                                clonedBrief.style.transform = "none";
                                clonedBrief.style.margin = "0";
                                clonedBrief.style.boxShadow = "none";
                                clonedBrief.style.borderRadius = "0";
                                clonedBrief.style.position = "relative";
                                clonedBrief.style.top = "0";
                                clonedBrief.style.left = "0";
                                clonedBrief.style.display = "flex";
                            }
                            const wrapper = clonedDoc.querySelector(".pdf-export-wrapper");
                            if (wrapper) {
                                wrapper.style.transform = "none";
                                wrapper.style.margin = "0";
                                wrapper.style.padding = "0";
                            }
                        }
                    });

                    const imgData = canvas.toDataURL("image/jpeg", 0.98);
                    const { jsPDF } = window.jspdf;
                    
                    // Exact standard A4 dimensions: 210mm x 297mm
                    const pdf = new jsPDF({
                        orientation: "portrait",
                        unit: "mm",
                        format: "a4",
                        compress: true
                    });

                    pdf.addImage(imgData, "JPEG", 0, 0, 210, 297, undefined, "FAST");
                    pdf.save(filename);

                    setIsGenerating(false);
                    showToast("Official A4 PDF Brief downloaded successfully!");
                } catch (err) {
                    console.error("PDF generation error:", err);
                    setIsGenerating(false);
                    showToast("Direct download failed. Opening browser print dialog...");
                    window.print();
                }
            };

            return (
                <div className="min-h-screen min-h-[100dvh] flex flex-col bg-slate-950 text-slate-100">
                    
                    {/* Top Global Navigation Bar */}
                    <header className="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 shadow-xl no-print">
                        <div className="h-1 uganda-flag-stripe w-full"></div>
                        
                        <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between gap-2 sm:gap-4">
                            
                            <div className="flex items-center space-x-2 sm:space-x-3 flex-1 min-w-0 overflow-hidden">
                                {/* Uganda Flag Badge */}
                                <div className="w-8 h-8 sm:w-10 sm:h-10 rounded-full shrink-0 overflow-hidden border-2 border-amber-500/60 shadow-lg" style={{boxShadow:'0 0 0 1px rgba(251,191,36,0.2), 0 2px 8px rgba(0,0,0,0.5)'}}>
                                    <svg viewBox="0 0 90 60" xmlns="http://www.w3.org/2000/svg" style={{width:'100%',height:'100%',display:'block'}}>
                                        {/* 6 horizontal stripes: black, yellow, red (×2) */}
                                        <rect width="90" height="10" y="0"  fill="#000000"/>
                                        <rect width="90" height="10" y="10" fill="#FCDC04"/>
                                        <rect width="90" height="10" y="20" fill="#D92323"/>
                                        <rect width="90" height="10" y="30" fill="#000000"/>
                                        <rect width="90" height="10" y="40" fill="#FCDC04"/>
                                        <rect width="90" height="10" y="50" fill="#D92323"/>
                                        {/* Central white circle */}
                                        <circle cx="45" cy="30" r="13" fill="white" stroke="white" strokeWidth="0.5"/>
                                        {/* Grey Crowned Crane — simplified */}
                                        {/* Body */}
                                        <ellipse cx="45" cy="33" rx="5.5" ry="4" fill="#4a4a4a"/>
                                        {/* Neck */}
                                        <rect x="43.5" y="25.5" width="3" height="8" rx="1.5" fill="#4a4a4a"/>
                                        {/* Head */}
                                        <circle cx="45" cy="24.5" r="2.8" fill="#4a4a4a"/>
                                        {/* Red cheek patch */}
                                        <ellipse cx="46.5" cy="25.2" rx="1.1" ry="0.7" fill="#D92323"/>
                                        {/* White cheek */}
                                        <ellipse cx="43.8" cy="25" rx="0.9" ry="0.6" fill="white"/>
                                        {/* Crown — gold bristles */}
                                        <line x1="44" y1="22" x2="43" y2="19.5" stroke="#FCDC04" strokeWidth="0.8" strokeLinecap="round"/>
                                        <line x1="45" y1="21.7" x2="45" y2="19" stroke="#FCDC04" strokeWidth="0.8" strokeLinecap="round"/>
                                        <line x1="46" y1="22" x2="47" y2="19.5" stroke="#FCDC04" strokeWidth="0.8" strokeLinecap="round"/>
                                        <line x1="44.5" y1="21.8" x2="43.5" y2="19.2" stroke="#FCDC04" strokeWidth="0.6" strokeLinecap="round"/>
                                        <line x1="45.5" y1="21.8" x2="46.5" y2="19.2" stroke="#FCDC04" strokeWidth="0.6" strokeLinecap="round"/>
                                        {/* Wing detail */}
                                        <ellipse cx="43" cy="33" rx="3.5" ry="2.5" fill="#666" transform="rotate(-10 43 33)"/>
                                        {/* Legs */}
                                        <line x1="43.5" y1="37" x2="43" y2="41" stroke="#4a4a4a" strokeWidth="0.8" strokeLinecap="round"/>
                                        <line x1="46.5" y1="37" x2="47" y2="41" stroke="#4a4a4a" strokeWidth="0.8" strokeLinecap="round"/>
                                        {/* Feet */}
                                        <line x1="43" y1="41" x2="41.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round"/>
                                        <line x1="43" y1="41" x2="44.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round"/>
                                        <line x1="47" y1="41" x2="45.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round"/>
                                        <line x1="47" y1="41" x2="48.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round"/>
                                    </svg>
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-1.5 truncate">
                                        <h1 className="font-cinzel text-sm sm:text-base md:text-lg font-bold tracking-wide text-amber-400 truncate">
                                            {countryName}
                                        </h1>
                                        <span className="text-[10px] font-sans px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-medium border border-slate-700 hidden xs:inline-block shrink-0">
                                            EchoMUN '26
                                        </span>
                                    </div>
                                    <p className="text-[10px] sm:text-xs text-slate-400 truncate font-sans hidden xs:block">
                                        {delegateName} • {committeeName}
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                                <button
                                    onClick={() => copyToClipboard(speechText, "Speech text")}
                                    className="px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition-colors border border-slate-700 flex items-center gap-1.5 shadow-sm active:scale-95"
                                    title="Copy Speech Text"
                                >
                                    <i className="fa-regular fa-copy text-amber-400 text-xs"></i>
                                    <span className="hidden md:inline">Copy Speech</span>
                                </button>

                                <button
                                    onClick={() => setActiveTab(activeTab === 'prompter' ? (isDesktop ? 'editor' : 'preview') : 'prompter')}
                                    className={`px-2.5 py-1.5 sm:px-3 sm:py-2 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 border active:scale-95 ${
                                        activeTab === 'prompter'
                                            ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-md shadow-amber-500/20 font-bold'
                                            : 'bg-slate-800 hover:bg-slate-700 text-amber-400 border-slate-700'
                                    }`}
                                    title="Open Live Podium Delivery Mode"
                                >
                                    <i className="fa-solid fa-microphone-lines text-xs"></i>
                                    <span className="hidden sm:inline">Podium Mode</span>
                                </button>

                                <button
                                    onClick={downloadPDF}
                                    disabled={isGenerating}
                                    className="px-3 py-1.5 sm:px-4 sm:py-2 text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg transition-all shadow-md hover:shadow-amber-500/25 flex items-center gap-1.5 font-sans disabled:opacity-50 active:scale-95 cursor-pointer"
                                    title="Export Official 1-Page A4 PDF Brief"
                                >
                                    {isGenerating ? (
                                        <i className="fa-solid fa-circle-notch fa-spin text-xs"></i>
                                    ) : (
                                        <i className="fa-solid fa-file-pdf text-xs sm:text-sm"></i>
                                    )}
                                    <span className="hidden xs:inline">Download PDF</span>
                                    <span className="inline xs:hidden">PDF</span>
                                </button>
                            </div>
                        </div>

                        {/* Mobile Segmented Tab Switcher */}
                        <div className="lg:hidden border-t border-slate-800/80 bg-slate-900/90 px-1.5 py-1.5">
                            <div className="grid grid-cols-4 gap-1 w-full">
                                <button
                                    onClick={() => setActiveTab('editor')}
                                    className={`py-1.5 rounded-lg text-xs font-medium flex flex-col items-center gap-0.5 transition-all w-full ${
                                        activeTab === 'editor'
                                            ? 'bg-amber-500 text-slate-950 font-bold shadow-sm'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                                    }`}
                                >
                                    <i className="fa-solid fa-pen-to-square text-sm"></i>
                                    <span className="text-[10px] leading-tight">Editor</span>
                                </button>

                                <button
                                    onClick={() => setActiveTab('preview')}
                                    className={`py-1.5 rounded-lg text-xs font-medium flex flex-col items-center gap-0.5 transition-all w-full ${
                                        activeTab === 'preview'
                                            ? 'bg-amber-500 text-slate-950 font-bold shadow-sm'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                                    }`}
                                >
                                    <i className="fa-solid fa-file-lines text-sm"></i>
                                    <span className="text-[10px] leading-tight">Preview</span>
                                </button>

                                <button
                                    onClick={() => setActiveTab('prompter')}
                                    className={`py-1.5 rounded-lg text-xs font-medium flex flex-col items-center gap-0.5 transition-all w-full ${
                                        activeTab === 'prompter'
                                            ? 'bg-amber-500 text-slate-950 font-bold shadow-sm'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                                    }`}
                                >

                                                                    <ellipse cx="46.5" cy="25.2" rx="1.1" ry="0.7" fill="#D92323" />
                                                                    <ellipse cx="43.8" cy="25" rx="0.9" ry="0.6" fill="#ffffff" />
                                                                    {/* Crown bristles */}
                                                                    <line x1="44" y1="22" x2="43" y2="19.5" stroke="#FCDC04" strokeWidth="0.8" strokeLinecap="round" />
                                                                    <line x1="45" y1="21.7" x2="45" y2="19" stroke="#FCDC04" strokeWidth="0.8" strokeLinecap="round" />
                                                                    <line x1="46" y1="22" x2="47" y2="19.5" stroke="#FCDC04" strokeWidth="0.8" strokeLinecap="round" />
                                                                    <line x1="44.5" y1="21.8" x2="43.5" y2="19.2" stroke="#FCDC04" strokeWidth="0.6" strokeLinecap="round" />
                                                                    <line x1="45.5" y1="21.8" x2="46.5" y2="19.2" stroke="#FCDC04" strokeWidth="0.6" strokeLinecap="round" />
                                                                    {/* Wing */}
                                                                    <ellipse cx="43" cy="33" rx="3.5" ry="2.5" fill="#666666" transform="rotate(-10 43 33)" />
                                                                    {/* Legs & Feet */}
                                                                    <line x1="43.5" y1="37" x2="43" y2="41" stroke="#4a4a4a" strokeWidth="0.8" strokeLinecap="round" />
                                                                    <line x1="46.5" y1="37" x2="47" y2="41" stroke="#4a4a4a" strokeWidth="0.8" strokeLinecap="round" />
                                                                    <line x1="43" y1="41" x2="41.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round" />
                                                                    <line x1="43" y1="41" x2="44.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round" />
                                                                    <line x1="47" y1="41" x2="45.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round" />
                                                                    <line x1="47" y1="41" x2="48.5" y2="41.8" stroke="#4a4a4a" strokeWidth="0.7" strokeLinecap="round" />
                                                                </svg>
                                                            </div>
                                                            <div>
                                                                <div style={{ fontSize:'7px', fontWeight:700, letterSpacing:'1.8px', textTransform:'uppercase', color:'#92400e', marginBottom:'2px' }}>
                                                                    Official Mission Policy Document &nbsp;·&nbsp; <span style={{ fontFamily:'monospace', color:'#64748b', fontWeight:400 }}>REF: EchoMUN-GYF-2026-UG</span>
                                                                </div>
                                                                <div style={{ fontSize:'19px', fontWeight:900, fontFamily:"'Cinzel',serif", letterSpacing:'-0.5px', lineHeight:1.05, textTransform:'uppercase', color:'#0f172a' }}>{countryName}</div>
                                                                <div style={{ fontSize:'8.5px', color:'#475569', fontWeight:500, marginTop:'2px' }}>{committeeName} &nbsp;·&nbsp; Executive Policy Briefing Sheet</div>
                                                            </div>
                                                        </div>
                                                        <div style={{ textAlign:'right', display:'flex', flexDirection:'column', alignItems:'flex-end', gap:'4px' }}>
                                                            <div style={{ background:'#0f172a', color:'#fbbf24', fontSize:'8.5px', fontWeight:700, fontFamily:"'Cinzel',serif", padding:'3px 8px', borderRadius:'4px', letterSpacing:'1px' }}>EchoMUN 2026</div>
                                                            <div style={{ fontSize:'9px', fontWeight:700, color:'#0f172a' }}>Delegate: <span style={{ color:'#92400e', textDecoration:'underline', textDecorationColor:'#fbbf24' }}>{delegateName}</span></div>
                                                            <div style={{ fontSize:'7px', color:'#94a3b8' }}>Republic of Uganda</div>
                                                        </div>
                                                    </div>

                                                    {/* ── TOPIC BANNER ── */}
                                                    <div style={{ background:'#0f172a', color:'#f1f5f9', borderLeft:'4px solid #f59e0b', padding:'5px 10px', borderRadius:'4px', display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'9px', fontSize:'8px' }}>
                                                        <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
                                                            <span style={{ color:'#fbbf24', fontWeight:700, fontFamily:'monospace', letterSpacing:'1px' }}>&#9872; POLICY TOPIC:</span>
                                                            <span style={{ fontWeight:600, color:'#e2e8f0' }}>{topicName}</span>
                                                        </div>
                                                        <div style={{ fontFamily:'monospace', fontSize:'7px', background:'#1e293b', color:'#94a3b8', padding:'2px 7px', borderRadius:'3px', border:'1px solid #334155', flexShrink:0 }}>PUBLIC DIPLOMATIC BRIEF</div>
                                                    </div>

                                                    {/* ── TWO-COLUMN BODY ── */}
                                                    <div style={{ display:'grid', gridTemplateColumns:'1fr 186px', gap:'12px', flex:1, minHeight:0, overflow:'hidden' }}>

                                                        {/* LEFT: Opening Statement */}
                                                        <div style={{ display:'flex', flexDirection:'column', gap:'7px', borderRight:'1px solid #e2e8f0', paddingRight:'12px', overflow:'hidden' }}>
                                                            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'#f8fafc', borderLeft:'3px solid #d97706', padding:'4px 8px', borderRadius:'3px' }}>
                                                                <span style={{ fontSize:'8px', fontWeight:800, fontFamily:"'Cinzel',serif", textTransform:'uppercase', letterSpacing:'0.8px', color:'#0f172a', display:'flex', alignItems:'center', gap:'5px' }}>
                                                                    <span style={{ color:'#d97706' }}>&#128226;</span> Executive Opening Statement
                                                                </span>
                                                                <span style={{ fontSize:'7px', fontFamily:'monospace', fontWeight:700, background:'#fef3c7', color:'#92400e', padding:'2px 5px', borderRadius:'3px', border:'1px solid #fcd34d', flexShrink:0 }}>~{estimatedSeconds}s · {wordCount}w</span>
                                                            </div>
                                                            <div style={{ fontSize:'8.5px', fontFamily:"'Merriweather',serif", lineHeight:1.65, color:'#1e293b', whiteSpace:'pre-wrap', wordBreak:'break-word', borderLeft:'2px solid rgba(245,158,11,0.35)', paddingLeft:'8px', flex:1, overflow:'hidden' }}>
                                                                {speechText}
                                                            </div>
                                                            <div style={{ background:'#fffbeb', border:'1px solid #fde68a', borderRadius:'4px', padding:'5px 8px', fontSize:'7.5px', color:'#78350f', flexShrink:0 }}>
                                                                <div style={{ fontWeight:700, textTransform:'uppercase', letterSpacing:'0.8px', fontSize:'6.5px', marginBottom:'2px' }}>&#127908; Oratory Delivery Protocol</div>
                                                                <span style={{ fontStyle:'italic', color:'#92400e', lineHeight:1.45 }}>Deliver with firm cadence. Pause after <strong>"...without a single shield."</strong> Maintain eye contact with the dais during the two-tier operational model.</span>
                                                            </div>
                                                        </div>

                                                        {/* RIGHT: Motions + Resolutions + Alliances */}
                                                        <div style={{ display:'flex', flexDirection:'column', gap:'7px', overflow:'hidden' }}>

                                                            {/* Motions */}
                                                            <div style={{ flexShrink:0 }}>
                                                                <div style={{ background:'#f8fafc', borderLeft:'3px solid #0f172a', padding:'4px 8px', borderRadius:'3px', marginBottom:'4px' }}>
                                                                    <span style={{ fontSize:'7.5px', fontWeight:800, fontFamily:"'Cinzel',serif", textTransform:'uppercase', letterSpacing:'0.8px', color:'#0f172a' }}>&#9878; Strategic Motions</span>
                                                                </div>
                                                                <div style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
                                                                    {motions.map((m, idx) => (
                                                                        <div key={m.id} style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:'3px', padding:'4px 6px', fontSize:'7px' }}>
                                                                            <div style={{ display:'flex', justifyContent:'space-between', fontWeight:700, marginBottom:'2px' }}>
                                                                                <span style={{ color:'#92400e', fontFamily:'monospace' }}>M{idx+1}. {m.type}</span>
                                                                                <span style={{ background:'#e2e8f0', color:'#475569', padding:'0 3px', borderRadius:'2px', fontFamily:'monospace' }}>{m.totalTime}</span>
                                                                            </div>
                                                                            <div style={{ fontWeight:600, color:'#1e293b', lineHeight:1.3, marginBottom:'1px' }}>&#8220;{m.title}&#8221;</div>
                                                                            <div style={{ color:'#64748b', lineHeight:1.25, fontSize:'6.5px' }}><strong>Aim:</strong> {m.purpose}</div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>

                                                            {/* Resolutions */}
                                                            <div style={{ flexShrink:0 }}>
                                                                <div style={{ background:'#f8fafc', borderLeft:'3px solid #dc2626', padding:'4px 8px', borderRadius:'3px', marginBottom:'4px' }}>
                                                                    <span style={{ fontSize:'7.5px', fontWeight:800, fontFamily:"'Cinzel',serif", textTransform:'uppercase', letterSpacing:'0.8px', color:'#0f172a' }}>&#128221; Draft Operatives</span>
                                                                </div>
                                                                <div style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:'3px', padding:'5px 6px', display:'flex', flexDirection:'column', gap:'4px' }}>
                                                                    {resolutions.map((r, i) => (
                                                                        <div key={r.id} style={{ display:'flex', gap:'4px', fontSize:'7px', lineHeight:1.4, color:'#1e293b' }}>
                                                                            <span style={{ fontWeight:700, color:'#92400e', fontFamily:'monospace', flexShrink:0 }}>{i+1}.</span>
                                                                            <p style={{ margin:0 }}><em style={{ textDecoration:'underline', textDecorationColor:'#fbbf24', fontWeight:700, fontStyle:'italic', color:'#0f172a' }}>{r.prefix}</em>{' '}{r.text}</p>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>

                                                            {/* Alliances */}
                                                            <div style={{ background:'#fffbeb', border:'1px solid #fde68a', borderRadius:'4px', padding:'5px 7px', fontSize:'7px', color:'#78350f', flexShrink:0 }}>
                                                                <div style={{ fontWeight:700, textTransform:'uppercase', letterSpacing:'0.8px', fontSize:'6.5px', marginBottom:'2px' }}>&#129309; Caucus Alliances</div>
                                                                <p style={{ margin:0, lineHeight:1.4, color:'#475569' }}>Align with Non-Aligned Movement (NAM), African Union delegates, and low-resource digital health advocates for co-sponsorship.</p>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* ── FOOTER ── */}
                                                    <div style={{ marginTop:'9px', paddingTop:'7px', borderTop:'2px solid #0f172a', display:'flex', justifyContent:'space-between', alignItems:'flex-end', fontSize:'7px', color:'#64748b', fontFamily:'monospace', flexShrink:0 }}>
                                                        <div>
                                                            <div style={{ fontWeight:700, color:'#0f172a', fontSize:'7.5px' }}>DELEGATION OF THE REPUBLIC OF UGANDA</div>
                                                            <div style={{ color:'#94a3b8' }}>GLOBAL YOUTH FORUM (ECHOMUN 2026) · OFFICIAL BRIEF</div>
                                                        </div>
                                                        <div style={{ textAlign:'center', borderTop:'1px solid #cbd5e1', paddingTop:'3px' }}>
                                                            <div style={{ fontFamily:'serif', fontStyle:'italic', fontWeight:700, color:'#0f172a', fontSize:'9px' }}>{delegateName}</div>
                                                            <div style={{ fontSize:'6px', color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.8px' }}>Authorized Delegate Signature</div>
                                                        </div>
                                                        <div style={{ textAlign:'right' }}>
                                                            <div style={{ fontWeight:700, color:'#1e293b', fontSize:'7.5px' }}>PAGE 1 OF 1</div>
                                                            <div style={{ color:'#92400e', fontWeight:700 }}>VERIFIED DRAFT</div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Uganda Flag Bottom Bar */}
                                                <div style={{ height:'5px', background:'linear-gradient(90deg,#D92323 33.3%,#FCDC04 33.3% 66.6%,#000 66.6%)', flexShrink:0 }} />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                {/* MODE 3: CAUCUS & RESOLUTION MANAGER (Mobile/Tablet Only) */}
                                {activeTab === 'caucus' && !isDesktop && (
                                    <section className="space-y-4">
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-4">
                                            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                                <h2 className="text-sm font-bold text-amber-400 uppercase tracking-wider font-cinzel flex items-center gap-2">
                                                    <i className="fa-solid fa-handshake"></i> Bloc Caucus Strategy
                                                </h2>
                                                <span className="text-[10px] bg-slate-800 text-amber-400 px-2 py-0.5 rounded font-mono">
                                                    EchoMUN '26
                                                </span>
                                            </div>

                                            <div className="space-y-3">
                                                {motions.map((m, idx) => (
                                                    <div key={m.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2 text-xs">
                                                        <div className="flex justify-between items-center font-bold">
                                                            <span className="text-amber-400 font-mono">Motion {idx + 1}: {m.type}</span>
                                                            <span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono text-[10px]">{m.totalTime}</span>
                                                        </div>
                                                        <p className="font-semibold text-slate-200 text-sm">"{m.title}"</p>
                                                        <p className="text-slate-400 text-xs"><strong className="text-slate-300">Goal:</strong> {m.purpose}</p>
                                                        <button
                                                            onClick={() => copyToClipboard(`Delegate of Uganda moves for a ${m.type} of ${m.totalTime} with a ${m.speakerTime} speaker time on "${m.title}".`, `Motion ${idx + 1}`)}
                                                            className="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors border border-slate-700"
                                                        >
                                                            <i className="fa-regular fa-copy"></i> Copy Formal Motion Call
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-4">
                                            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                                <h2 className="text-sm font-bold text-amber-400 uppercase tracking-wider font-cinzel flex items-center gap-2">
                                                    <i className="fa-solid fa-file-signature text-red-500"></i> Operative Clauses
                                                </h2>
                                                <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-mono">
                                                    Working Paper
                                                </span>
                                            </div>

                                            <div className="space-y-2.5">
                                                {resolutions.map((r, idx) => (
                                                    <div key={r.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1.5 text-xs">
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-bold text-amber-400 font-mono">Clause {idx + 1}</span>
                                                            <button
                                                                onClick={() => copyToClipboard(`${r.prefix} ${r.text}`, `Clause ${idx + 1}`)}
                                                                className="text-slate-400 hover:text-amber-400 text-[11px] flex items-center gap-1"
                                                            >
                                                                <i className="fa-regular fa-copy"></i> Copy Clause
                                                            </button>
                                                        </div>
                                                        <p className="text-slate-200 leading-relaxed">
                                                            <strong className="underline decoration-amber-500 font-serif italic text-amber-300">{r.prefix}</strong> {r.text}
                                                        </p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </section>
                                )}

                            </div>
                        )}

                    </main>
                    
                    {/* Bottom Mobile Sticky Action Bar */}
                    {activeTab !== 'prompter' && (
                        <div className="lg:hidden sticky bottom-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-3 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom,0px))] flex items-center justify-between gap-2 shadow-2xl no-print">
                            <button
                                onClick={() => setActiveTab('prompter')}
                                className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700 active:scale-95"
                            >
                                <i className="fa-solid fa-microphone-lines"></i>
                                <span>Podium Mode</span>
                            </button>

                            <button
                                onClick={() => copyToClipboard(speechText, "Speech text")}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700 active:scale-95"
                            >
                                <i className="fa-regular fa-copy text-amber-400"></i>
                                <span>Copy</span>
                            </button>

                            <button
                                onClick={downloadPDF}
                                disabled={isGenerating}
                                className="flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg active:scale-95 disabled:opacity-50"
                            >
                                {isGenerating ? (
                                    <i className="fa-solid fa-circle-notch fa-spin"></i>
                                ) : (
                                    <i className="fa-solid fa-file-pdf"></i>
                                )}
                                <span>PDF Brief</span>
                            </button>
                        </div>
                    )}

                </div>
            );
        }

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
